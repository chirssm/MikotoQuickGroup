name: Build Tweak

# 触发方式：推送到 main / 手动点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # macOS runner 自带 Xcode 与 iOS SDK —— 这是产出 iOS dylib 的关键
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"

      - name: 安装 iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/*.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          ls "$HOME/theos/sdks" | head -5

      - name: 安装打包依赖
        run: brew install ldid dpkg || true

      - name: 构建
        run: |
          make clean || true
          make package || make

      - name: 定位产物
        run: |
          echo "--- .dylib ---"
          find . -name "*.dylib" -not -path "./.git/*" -print
          echo "--- .deb ---"
          find . -name "*.deb" -not -path "./.git/*" -print

      - name: 收集产物（复制到非隐藏目录）
        run: |
          mkdir -p dist
          find .theos -name "*.dylib" -exec cp {} dist/ \; 2>/dev/null || true
          find .theos -name "*.dylib" -print
          ls -la dist/ || true

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: MikotoQuickGroup-dylib
          path: dist/*.dylib
          if-no-files-found: error

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: MikotoQuickGroup-deb
          path: packages/*.deb
          if-no-files-found: warn
